# configs/train.yaml

prefix: "ATT&DAR_"
experiment_name: ${prefix}${model.name}_${now:%Y-%m-%d_%H-%M-%S}

hydra:
  output_subdir: null
  run:
    dir: .

# === paramètres globaux ===
dropout: 0.1               # taux de dropout unique
batch_size: 32
learning_rate: 3e-4
epochs: 5
weight_decay: 0.01
warmup_steps: 500
lr_scheduler_type: "cosine"
early_stopping_patience: 2
max_grad_norm: 1.0


# === configuration du modèle ===
model:
  instance:
    _target_: models.hf_transformer.HFTransformer
    pretrained_model_name_or_path: "facebook/dinov2-base"
    num_classes: 10
    # On injecte ici la valeur de dropout définie plus haut
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1

# === configuration du datamodule ===
datamodule:
  _target_: data.datamodule.DataModule
  dataset_path: ${data_dir}
  train_transform: ${dataset.train_transform}
  test_transform: ${dataset.val_transform}
  batch_size: ${dataset.batch_size}
  num_workers: ${dataset.num_workers}
  metadata: ${dataset.metadata}
  taille_val: 0.2


data_dir: ${root_dir}/dataset/
root_dir:  ${hydra:runtime.cwd}
checkpoint_path: ${root_dir}/checkpoints/${experiment_name}.pt


# === logging & checkpoints ===
log: true
checkpoint_dir: "./checkpoints"
logging_steps: 50
fp16: true
grad_accum_steps: 1
