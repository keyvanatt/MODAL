defaults:
    - _self_
    - dataset: default
    - optim: adamw
    - model: multimodal
    - loss_fn: huber

max_epochs: 40
log: True
prefix: "ATT&DAR_"
experiment_name: ${prefix}${model.name}_${now:%Y-%m-%d_%H-%M-%S}

checkpoint_interval: 5

min_learning_rate: 1e-7
switch_learning_rate: 3e-5
patience_learning_rate: 3
factor_learning_rate: 0.5

# Correspond à la tolérance maximale de remontée de val_loss
aberration_val_loss: 0.5

hydra:
  output_subdir: null
  run:
    dir: ${root_dir}/outputs/${experiment_name}

# Les trucs entre ${} font référence aux fichiers plus hauts dans l'arborescence

datamodule:
  _target_: data.datamodule.DataModuleModern
  dataset_path: ${data_dir}
  train_transform: ${dataset.train_transform}
  test_transform: ${dataset.val_transform}
  batch_size: ${dataset.batch_size}
  num_workers: ${dataset.num_workers}
  sliding_window: False
  taille_val: 0.2

data_dir: ${root_dir}/dataset/
root_dir:  ${hydra:runtime.cwd}
checkpoint_path: /Data/checkpoints/${experiment_name}.pt
min_checkpoint_path: /Data/checkpoints/MIN_${experiment_name}.pt
